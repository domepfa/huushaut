<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Haushaltsplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #EEF2E9;
    --card: #ffffff;
    --ink: #26362B;
    --muted: #5C6E5F;
    --border: #E4E9DC;
    --weekly: #C98A2C;
    --monthly: #4A7A93;
    --once: #B15D6C;
    --person-a: #2F6D5C;
    --person-b: #C9587A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .reset-link { background: none; border: none; color: #8A6B6B; font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .reset-link:hover { opacity: 0.7; }
  .confirm-bar { background: #FBECEC; border: 1px solid #E3B8B8; border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
  .confirm-bar .btns { display: flex; gap: 8px; }
  .confirm-bar button.danger { background: var(--once); color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .confirm-bar button.plain { background: #fff; border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
  nav button { border: 1px solid var(--border); background: #fff; color: #4A5A4D; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  nav button.active { border-color: transparent; color: #fff; }
  nav button .count { background: #EEF2E9; color: var(--muted); font-size: 11px; padding: 1px 7px; border-radius: 999px; }
  nav button.active .count { background: rgba(255,255,255,0.25); color: #fff; }
  form.add { display: flex; gap: 8px; margin-bottom: 22px; }
  form.add input { flex: 1; border: 1px solid var(--border); background: #fff; border-radius: 12px; padding: 11px 14px; font-size: 14px; font-family: inherit; outline: none; }
  form.add input:focus { box-shadow: 0 0 0 2px #C9D3C0; }
  form.add button { color: #fff; border: none; border-radius: 12px; padding: 11px 16px; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .empty { border: 1px dashed #C9D3C0; color: #7C8A7E; border-radius: 12px; padding: 34px; text-align: center; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); transition: transform .15s, box-shadow .15s; }
  .tile:hover { transform: rotate(0deg) !important; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
  .tile-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .tile-title { font-size: 14px; font-weight: 500; line-height: 1.4; margin: 0; }
  .del-btn { background: none; border: none; color: #B7BDAF; cursor: pointer; padding: 0; line-height: 1; flex-shrink: 0; }
  .del-btn:hover { color: #d15757; }
  .mark-row { display: flex; gap: 6px; margin-top: 12px; }
  .mark-row button { flex: 1; font-size: 12px; border-radius: 10px; padding: 7px 0; background: transparent; cursor: pointer; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .done-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .avatar { width: 16px; height: 16px; border-radius: 999px; color: #fff; font-size: 9px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; margin-right: 6px; }
  .note { font-family: 'IBM Plex Mono', monospace; font-size: 10px; }
  .loading { color: #8A968C; font-size: 14px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 14px; padding: 10px 16px; border-radius: 999px; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
  .toast button { background: none; border: none; color: #fff; cursor: pointer; opacity: 0.7; }
  .config-warning { background: #FFF6E0; border: 1px solid #E9CE8A; border-radius: 12px; padding: 16px; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
  .config-warning code { background: #fff; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Haushaltsplan</h1>
      <p class="sub">Geteilt zwischen Ich &amp; Sarah</p>
    </div>
    <button class="reset-link" id="resetLink">↺ Zurücksetzen</button>
  </header>

  <div id="confirmBar" class="confirm-bar" style="display:none;">
    <span>Wirklich alle Aufgaben unwiderruflich löschen?</span>
    <div class="btns">
      <button class="danger" id="confirmYes">Ja, löschen</button>
      <button class="plain" id="confirmNo">Abbrechen</button>
    </div>
  </div>

  <nav id="tabs"></nav>
  <form class="add" id="addForm" style="display:none;">
    <input id="newTitle" type="text" placeholder="Neue Aufgabe…" autocomplete="off" />
    <button type="submit">+ Anlegen</button>
  </form>

  <div id="content"><p class="loading">Lädt…</p></div>
</div>

<div id="toastWrap"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ---------------------------------------------------------------
  // HIER DEINE FIREBASE-ZUGANGSDATEN EINTRAGEN (siehe Anleitung im Chat)
  // ---------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "DEIN_API_KEY",
    authDomain: "DEIN_PROJEKT.firebaseapp.com",
    projectId: "DEIN_PROJEKT",
    storageBucket: "DEIN_PROJEKT.appspot.com",
    messagingSenderId: "DEINE_SENDER_ID",
    appId: "DEINE_APP_ID"
  };

  const CONFIG_MISSING = firebaseConfig.apiKey === "DEIN_API_KEY";

  const CATEGORIES = {
    weekly: { label: "Wöchentlich", accent: "#C98A2C", note: "Kehrt am Montag zurück" },
    monthly: { label: "Monatlich", accent: "#4A7A93", note: "Kehrt am 1. zurück" },
    once: { label: "Einmalig", accent: "#B15D6C", note: "Verschwindet endgültig" },
  };
  const PEOPLE = { Ich: "#2F6D5C", Sarah: "#C9587A" };

  let tasks = [];
  let activeTab = "weekly";
  let db = null;
  let docRef = null;

  const pad = (n) => String(n).padStart(2, "0");
  function getISOWeekKey(d) {
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
    const weekNum = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
    return `${date.getUTCFullYear()}-W${pad(weekNum)}`;
  }
  const getMonthKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  function currentPeriodKey(category, now) {
    if (category === "weekly") return getISOWeekKey(now);
    if (category === "monthly") return getMonthKey(now);
    return null;
  }
  function formatDate(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function applyResets(list) {
    const now = new Date();
    let changed = false;
    const next = list.map((t) => {
      if (t.status === "done" && (t.category === "weekly" || t.category === "monthly")) {
        const cpk = currentPeriodKey(t.category, now);
        if (t.periodKey !== cpk) {
          changed = true;
          return { ...t, status: "active", doneBy: null, doneAt: null, periodKey: null };
        }
      }
      return t;
    });
    return { next, changed };
  }

  async function persist(next) {
    tasks = next;
    render();
    if (!db) return;
    try {
      await setDoc(docRef, { list: next });
    } catch (e) {
      console.error("Speichern fehlgeschlagen", e);
      showToast("Speichern fehlgeschlagen — Verbindung prüfen");
    }
  }

  function showToast(msg) {
    const wrap = document.getElementById("toastWrap");
    wrap.innerHTML = `<div class="toast">${msg}<button id="toastClose">✕</button></div>`;
    document.getElementById("toastClose").onclick = () => (wrap.innerHTML = "");
    setTimeout(() => (wrap.innerHTML = ""), 2200);
  }

  async function addTask(e) {
    e.preventDefault();
    const input = document.getElementById("newTitle");
    const title = input.value.trim();
    if (!title) return;
    const task = { id: uid(), title, category: activeTab, status: "active", createdAt: Date.now(), doneBy: null, doneAt: null, periodKey: null };
    await persist([task, ...tasks]);
    input.value = "";
  }

  async function markDone(id, person) {
    const task = tasks.find((t) => t.id === id);
    if (!task) return;
    if (task.category === "once") {
      showToast(`„${task.title}" erledigt von ${person}`);
      await persist(tasks.filter((t) => t.id !== id));
      return;
    }
    const now = new Date();
    const next = tasks.map((t) => t.id === id ? { ...t, status: "done", doneBy: person, doneAt: Date.now(), periodKey: currentPeriodKey(t.category, now) } : t);
    await persist(next);
  }

  async function deleteTask(id) {
    await persist(tasks.filter((t) => t.id !== id));
  }

  function countFor(cat) {
    return cat === "erledigt" ? tasks.filter((t) => t.status === "done").length : tasks.filter((t) => t.category === cat && t.status === "active").length;
  }

  function renderTabs() {
    const tabs = ["weekly", "monthly", "once", "erledigt"];
    const nav = document.getElementById("tabs");
    nav.innerHTML = "";
    tabs.forEach((tab) => {
      const meta = CATEGORIES[tab];
      const btn = document.createElement("button");
      btn.className = activeTab === tab ? "active" : "";
      btn.style.background = activeTab === tab ? (meta ? meta.accent : "#26362B") : "#fff";
      btn.style.color = activeTab === tab ? "#fff" : "#4A5A4D";
      btn.innerHTML = `${tab === "erledigt" ? "Erledigt" : meta.label} <span class="count">${countFor(tab)}</span>`;
      btn.onclick = () => { activeTab = tab; render(); };
      nav.appendChild(btn);
    });
    document.getElementById("addForm").style.display = activeTab === "erledigt" ? "none" : "flex";
    if (activeTab !== "erledigt") {
      const meta = CATEGORIES[activeTab];
      document.getElementById("newTitle").placeholder = `Neue ${meta.label.toLowerCase()}e Aufgabe…`;
      const btn = document.querySelector("form.add button");
      btn.style.background = meta.accent;
    }
  }

  function renderContent() {
    const el = document.getElementById("content");
    const visible = activeTab === "erledigt"
      ? tasks.filter((t) => t.status === "done").sort((a, b) => b.doneAt - a.doneAt)
      : tasks.filter((t) => t.category === activeTab && t.status === "active").sort((a, b) => b.createdAt - a.createdAt);

    if (visible.length === 0) {
      const msg = activeTab === "erledigt" ? "Noch nichts erledigt." : `Noch keine ${CATEGORIES[activeTab].label.toLowerCase()}e Aufgabe. Leg die erste an.`;
      el.innerHTML = `<div class="empty">${msg}</div>`;
      return;
    }

    const grid = document.createElement("div");
    grid.className = "grid";
    visible.forEach((t, i) => {
      const meta = CATEGORIES[t.category];
      const rotate = i % 2 === 0 ? "-0.4deg" : "0.4deg";
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.style.borderLeft = `4px solid ${meta.accent}`;
      tile.style.transform = `rotate(${rotate})`;

      let inner = `<div class="tile-top"><p class="tile-title">${escapeHtml(t.title)}</p><button class="del-btn" data-del="${t.id}">🗑</button></div>`;

      if (activeTab === "erledigt") {
        inner += `<div class="done-meta"><span><span class="avatar" style="background:${PEOPLE[t.doneBy]}">${t.doneBy?.[0] || ""}</span>${t.doneBy} · ${formatDate(t.doneAt)}</span>`;
        if (t.category !== "once") inner += `<span class="note" style="color:${meta.accent}">${meta.note}</span>`;
        inner += `</div>`;
      } else {
        inner += `<div class="mark-row">`;
        Object.keys(PEOPLE).forEach((person) => {
          inner += `<button data-done="${t.id}" data-person="${person}" style="border:1px solid ${PEOPLE[person]};color:${PEOPLE[person]}" onmouseenter="this.style.background='${PEOPLE[person]}';this.style.color='#fff'" onmouseleave="this.style.background='transparent';this.style.color='${PEOPLE[person]}'">✓ ${person}</button>`;
        });
        inner += `</div>`;
      }
      tile.innerHTML = inner;
      grid.appendChild(tile);
    });
    el.innerHTML = "";
    el.appendChild(grid);

    grid.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => deleteTask(b.dataset.del));
    grid.querySelectorAll("[data-done]").forEach((b) => b.onclick = () => markDone(b.dataset.done, b.dataset.person));
  }

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function render() {
    renderTabs();
    renderContent();
  }

  document.getElementById("addForm").addEventListener("submit", addTask);
  document.getElementById("resetLink").onclick = () => document.getElementById("confirmBar").style.display = "flex";
  document.getElementById("confirmNo").onclick = () => document.getElementById("confirmBar").style.display = "none";
  document.getElementById("confirmYes").onclick = async () => {
    document.getElementById("confirmBar").style.display = "none";
    await persist([]);
  };

  // --- Firebase-Verbindung ---
  if (CONFIG_MISSING) {
    document.getElementById("content").innerHTML = `<div class="config-warning">
      ⚠️ Noch nicht verbunden: Trag oben im Code (<code>firebaseConfig</code>) deine Firebase-Zugangsdaten ein, damit die Aufgaben zwischen euch geteilt gespeichert werden.
    </div>`;
    render();
  } else {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    docRef = doc(db, "household", "tasks");
    onSnapshot(docRef, (snap) => {
      const list = snap.exists() ? (snap.data().list || []) : [];
      const { next, changed } = applyResets(list);
      tasks = next;
      render();
      if (changed) setDoc(docRef, { list: next });
    }, (err) => {
      console.error(err);
      document.getElementById("content").innerHTML = `<div class="config-warning">⚠️ Verbindung zur Datenbank fehlgeschlagen. Prüf die Firebase-Zugangsdaten und die Firestore-Regeln.</div>`;
    });
  }
</script>
</body>
</html>
