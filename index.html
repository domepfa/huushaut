<style>
  :root {
    --mint: #DFF3EC; --ink: #142B2A; --ink-soft: #4C6563; --muted: #7A8F8C;
    --white: #FFFFFF; --line: rgba(20,43,42,0.12); --lift: rgba(20,43,42,0.13);
    --sun: #FFD84D; --sky: #9FD8FF; --rose: #FFB3C1; --coral: #FF6B4A; --coral-dark: #C94A2E; --teal: #2EC4B6;
    --weekly: var(--sun); --monthly: var(--sky); --once: var(--rose); --done: #E4ECE9;
    --pencil-ink: #233A6B;
    --chalkboard: #242E28; --chalk: #EDE9DA; --chalk-dim: #A9B3A5; --wood: #5B3E2B; --wood-dark: #402A1C;
    --ui: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
    --hand: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--mint); }
  body {
    margin: 0; background: var(--mint); color: var(--ink); font-family: var(--ui); font-size: 16px;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    min-height: 100vh; overflow-x: hidden; position: relative;
  }
  body::before { content: ""; position: fixed; width: 340px; height: 340px; border-radius: 50%; background: var(--sun); top: -170px; right: -120px; z-index: -1; }
  body::after { content: ""; position: fixed; width: 220px; height: 220px; border-radius: 50%; background: var(--sky); bottom: -90px; left: -90px; opacity: .55; z-index: -1; }
  button { font-family: inherit; }
  .ic { display: block; flex-shrink: 0; }
  .back-btn, .icon-btn, form.add button, .card .del, .tv-icon, .edit-btn, .del-btn, .note-del, .toast button.x, form.hand-add button { display: inline-grid; place-items: center; }
  .next-season { display: flex; align-items: center; justify-content: center; gap: 4px; }
  .setup .plain { display: inline-flex; align-items: center; gap: 6px; }
  .confirm-bar { display: flex; gap: 8px; align-items: flex-start; }
  .confirm-bar .ic { color: var(--coral-dark); margin-top: 1px; }
  .party .ic { margin: 0 auto 8px; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 18px 16px 90px; }

  /* ---- Kopf ---- */
  .app-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; min-height: 44px; }
  .app-head .title-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .back-btn { background: var(--white); border: none; color: var(--ink); font-size: 20px; font-weight: 700; width: 42px; height: 42px; border-radius: 14px; cursor: pointer; flex-shrink: 0; box-shadow: 0 4px 0 var(--lift); }
  .back-btn:active { transform: translateY(4px); box-shadow: none; }
  h1 { font-weight: 800; font-size: 26px; margin: 0; line-height: 1.05; letter-spacing: -0.01em; }
  .sub { color: var(--ink-soft); font-size: 12.5px; margin: 0; display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
  .dot.ok { background: var(--teal); } .dot.err { background: var(--coral); } .dot.wait { background: #E0B400; }
  .icon-btn { background: var(--white); border: none; color: var(--ink); width: 42px; height: 42px; border-radius: 14px; cursor: pointer; font-size: 19px; box-shadow: 0 4px 0 var(--lift); flex-shrink: 0; }
  .icon-btn:active { transform: translateY(4px); box-shadow: none; }
  .confirm-bar { background: var(--white); border: 3px solid var(--coral); border-radius: 18px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; font-weight: 500; }

  /* ---- Staubi ---- */
  .staubi { width: 78px; height: 78px; flex-shrink: 0; transform-origin: 50% 100%; cursor: pointer; }
  .staubi.small { width: 52px; height: 52px; }
  .staubi.jump { animation: jump .7s cubic-bezier(.3,1.6,.5,1); }
  @keyframes jump { 0% { transform: none; } 20% { transform: scale(1.15,.82); } 50% { transform: translateY(-24px) scale(.92,1.1) rotate(-6deg); } 80% { transform: scale(1.08,.92); } }
  .staubi .lid { transform-box: fill-box; transform-origin: 50% 0; animation: blink 5s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(0); } 96% { transform: scaleY(1); } }
  .hello { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .bubble { background: var(--white); border-radius: 20px 20px 20px 5px; padding: 10px 14px; font-weight: 600; font-size: 16px; line-height: 1.25; box-shadow: 0 4px 0 var(--lift); }
  .bubble.pop { animation: pop .4s cubic-bezier(.3,1.8,.5,1); }
  @keyframes pop { from { transform: scale(.6); } }

  /* ---- Startseite ---- */
  .progress { display: flex; align-items: center; gap: 14px; background: var(--white); border-radius: 24px; padding: 12px 16px; box-shadow: 0 5px 0 var(--lift); margin-bottom: 16px; }
  .ring { width: 56px; height: 56px; flex-shrink: 0; }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .bg { stroke: #EEF2F0; }
  .ring .val { stroke: var(--coral); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .9s cubic-bezier(.3,1.4,.5,1); }
  .progress b { display: block; font-size: 21px; line-height: 1.1; }
  .progress span { font-size: 14px; color: var(--ink-soft); font-weight: 500; }
  .chapters { display: grid; gap: 14px; }
  .chapter { position: relative; display: flex; align-items: flex-end; width: 100%; min-height: 138px; text-align: left; border: none; border-radius: 26px; padding: 16px 18px; cursor: pointer; overflow: hidden; color: #fff; background: #345 center / cover no-repeat; box-shadow: 0 6px 0 var(--lift); transition: transform .15s; }
  .chapter::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,25,24,0) 30%, rgba(10,25,24,.72)); }
  .chapter:active { transform: translateY(5px) scale(.99); box-shadow: 0 1px 0 var(--lift); }
  .chapter-body { position: relative; display: flex; flex-direction: column; min-width: 0; }
  .chapter-title { font-weight: 800; font-size: 25px; line-height: 1.05; text-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .chapter-sub { font-size: 14.5px; font-weight: 600; opacity: .92; }
  .chapter-tag { position: absolute; top: 12px; right: 12px; background: var(--white); color: var(--ink); font-weight: 800; font-size: 13px; border-radius: 12px; padding: 3px 10px; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
  .chapter--plan { background-image: url(img/plan.jpg); }
  .chapter--shop { background-image: url(img/einkauf.jpg); }
  .chapter--notes { background-image: url(img/notizen.jpg); }
  .chapters.intro .chapter { animation: rise .55s cubic-bezier(.3,1.4,.5,1) both; }
  .chapters.intro .chapter:nth-child(2) { animation-delay: .07s; } .chapters.intro .chapter:nth-child(3) { animation-delay: .14s; } .chapters.intro .chapter:nth-child(4) { animation-delay: .21s; }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } }

  /* ---- Haushaltsplan ---- */
  .pill-nav { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 14px; padding: 2px 16px 8px; scrollbar-width: none; }
  .pill { border: none; background: var(--white); color: var(--ink-soft); padding: 8px 14px; border-radius: 16px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 7px; white-space: nowrap; box-shadow: 0 4px 0 var(--lift); }
  .pill .count { background: #EEF2F0; font-size: 12.5px; padding: 0 8px; border-radius: 999px; }
  .pill.active { color: var(--ink); }
  .pill.active .count { background: rgba(255,255,255,.7); }
  form.add { display: flex; gap: 8px; margin-bottom: 16px; }
  form.add input { flex: 1; min-width: 0; border: 3px solid var(--white); background: var(--white); border-radius: 18px; padding: 10px 14px; font: 600 16px var(--ui); color: var(--ink); outline: none; box-shadow: 0 4px 0 var(--lift); }
  form.add input:focus { border-color: var(--teal); }
  form.add input::placeholder { color: var(--muted); }
  form.add button { width: 54px; flex-shrink: 0; border: none; border-radius: 18px; background: var(--coral); color: #fff; font: 800 28px/1 var(--ui); cursor: pointer; box-shadow: 0 4px 0 var(--coral-dark); }
  form.add button:active { transform: translateY(4px); box-shadow: none; }
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card { display: flex; align-items: center; gap: 12px; padding: 12px 10px 12px 14px; border-radius: 22px; background: var(--c, var(--white)); box-shadow: 0 5px 0 var(--lift); transition: transform .45s cubic-bezier(.5,-0.4,.6,1), opacity .3s .15s, margin .35s .35s, height .35s .35s, padding .35s .35s; }
  .card .t { flex: 1; min-width: 0; }
  .card b { display: block; font-size: 18px; line-height: 1.15; overflow-wrap: anywhere; }
  .card small { font-size: 13px; font-weight: 600; color: rgba(20,43,42,.62); }
  .card.cat-weekly { --c: var(--weekly); } .card.cat-monthly { --c: var(--monthly); } .card.cat-once { --c: var(--once); } .card.is-done { --c: var(--white); }
  .check { width: 46px; height: 46px; border-radius: 50%; border: 3px solid rgba(20,43,42,.35); background: rgba(255,255,255,.55); display: grid; place-items: center; flex-shrink: 0; cursor: pointer; padding: 0; transition: transform .1s; }
  .check:active { transform: scale(.9); }
  .check svg { width: 24px; height: 24px; transform: scale(0); }
  .card.done .check, .card.is-done .check { background: var(--ink); border-color: var(--ink); }
  .card.done .check svg { animation: pop2 .45s cubic-bezier(.3,2,.5,1) forwards; }
  .card.is-done .check svg { transform: none; }
  @keyframes pop2 { to { transform: scale(1); } }
  .card.squish { transform: scale(.95); transition: transform .1s; }
  .card.out { transform: translateX(115%) rotate(8deg); opacity: 0; height: 0; padding-block: 0; margin-top: -10px; }
  .card .del { width: 34px; height: 34px; border: none; background: none; color: rgba(20,43,42,.45); font-size: 17px; cursor: pointer; border-radius: 10px; flex-shrink: 0; }
  .card .del:active { background: rgba(255,255,255,.5); }
  .card.is-done b { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--ink-soft); }
  .card.is-done .reopen { border: none; background: #EEF2F0; color: var(--ink); font: 700 13px var(--ui); border-radius: 12px; padding: 6px 10px; cursor: pointer; flex-shrink: 0; }
  .who-dot { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 800; vertical-align: 1px; margin-right: 4px; }
  .empty { background: rgba(255,255,255,.6); border-radius: 22px; padding: 26px 18px; text-align: center; font-weight: 600; color: var(--ink-soft); font-size: 16px; }
  .empty .art, .tv-empty .art { display: flex; justify-content: center; margin-bottom: 6px; opacity: .8; }

  /* ---- Konfetti & Feier ---- */
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
  .party { position: fixed; inset: 0; display: grid; place-items: center; z-index: 55; pointer-events: none; }
  .party div { background: var(--ink); color: var(--sun); font-weight: 800; font-size: 30px; line-height: 1.1; text-align: center; padding: 22px 28px; border-radius: 28px; animation: party 2.6s cubic-bezier(.3,1.6,.5,1) forwards; transform: scale(0); }
  @keyframes party { 15% { transform: scale(1) rotate(-3deg); } 85% { transform: scale(1) rotate(-3deg); } 100% { transform: scale(0) rotate(6deg); } }

  /* ---- Einkaufsliste: Klemmbrett ---- */
  .cb { position: relative; margin-top: 18px; border-radius: 18px; padding: 34px 12px 14px; background: #8E6236; background-size: 300px 300px; box-shadow: 0 16px 26px -12px rgba(0,0,0,.55); animation: cbIn .55s cubic-bezier(.25,1.3,.5,1) both; }
  @keyframes cbIn { from { transform: translateY(60px) rotate(2deg); opacity: 0; } }
  .cb-clip { position: absolute; top: -14px; left: 50%; width: 128px; height: 48px; margin-left: -64px; border-radius: 10px 10px 18px 18px; background: linear-gradient(180deg, #f4f4f4, #aaa 45%, #dcdcdc 55%, #8d8d8d); box-shadow: 0 5px 8px rgba(0,0,0,.4), inset 0 1px 0 #fff; z-index: 3; }
  .cb-clip::after { content: ""; position: absolute; left: 50%; top: 10px; width: 24px; height: 10px; margin-left: -12px; border-radius: 6px; background: #6b6b6b; box-shadow: inset 0 2px 2px rgba(0,0,0,.5); }
  .sheet { position: relative; background-color: #FBF8EE; background-size: 180px 180px; box-shadow: 0 2px 5px rgba(0,0,0,.28); min-height: 62vh; padding-bottom: 10px; }
  .sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: 44px; width: 1.5px; background: rgba(205,70,70,.45); }
  .sheet-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; padding: 24px 12px 6px 56px; }
  .sheet-head h2 { margin: 0; font: 700 34px/1 var(--hand); color: #2E2216; }
  .eraser-btn { border: none; cursor: pointer; font: 700 13px var(--ui); color: #fff; padding: 6px 12px; border-radius: 5px; background: linear-gradient(90deg, #E7798C 0 64%, #3E6FB5 64% 100%); box-shadow: 0 3px 5px rgba(0,0,0,.3); transform: rotate(3deg); white-space: nowrap; }
  .eraser-btn:active { transform: rotate(3deg) translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .list-paper { list-style: none; margin: 0; padding: 0; background: repeating-linear-gradient(transparent 0 41px, rgba(70,110,170,.3) 41px 42px); }
  .list-paper li { position: relative; height: 42px; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 0; }
  .list-paper li.dragging-row { background: #FBF8EE; box-shadow: 0 8px 18px rgba(0,0,0,.22); z-index: 5; }
  .drag-handle { width: 44px; align-self: stretch; background: none; border: none; color: rgba(46,34,22,.28); font-size: 18px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; flex-shrink: 0; padding: 0; }
  .item-btn { flex: 1; min-width: 0; height: 100%; background: none; border: none; text-align: left; padding: 0 0 0 10px; cursor: pointer; display: flex; align-items: center; }
  .item { position: relative; font: 700 27px/1 var(--hand); color: var(--pencil-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 4px 4px 0 0; }
  .list-paper li.write .item { animation: write .9s steps(14) both; }
  @keyframes write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .strike { position: absolute; left: -3px; right: -3px; top: 50%; height: 14px; margin-top: -5px; width: calc(100% + 6px); overflow: visible; pointer-events: none; }
  .strike path { fill: none; stroke: #3A3A3A; stroke-width: 2.6; stroke-linecap: round; }
  li.bought .item { color: rgba(35,58,107,.5); }
  li.bought.animate .strike { animation: wipe .45s cubic-bezier(.6,0,.4,1) both; }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  li.erase { animation: erase .6s ease forwards; }
  @keyframes erase { 30% { transform: translateX(-5px); } 60% { transform: translateX(5px); filter: blur(1px); opacity: .5; } to { opacity: 0; filter: blur(3px); } }
  .edit-btn { width: 36px; height: 36px; background: none; border: none; color: rgba(46,34,22,.35); cursor: pointer; font-size: 16px; flex-shrink: 0; border-radius: 10px; }
  .edit-input { flex: 1; min-width: 0; border: none; border-bottom: 2px dashed rgba(35,58,107,.4); background: rgba(255,255,255,.6); font: 700 25px var(--hand); color: var(--pencil-ink); outline: none; margin-left: 10px; padding: 0 4px; }
  .paper-btn { border: none; background: var(--teal); color: #fff; border-radius: 10px; padding: 6px 10px; font: 700 13px var(--ui); cursor: pointer; flex-shrink: 0; }
  .del-btn { background: none; border: none; color: rgba(46,34,22,.45); cursor: pointer; padding: 4px 8px; font-size: 16px; flex-shrink: 0; }
  form.hand-add { display: flex; align-items: center; height: 42px; padding: 0 10px 0 54px; border-bottom: 1px solid rgba(70,110,170,.3); }
  form.hand-add input { flex: 1; min-width: 0; border: none; background: none; font: 700 27px var(--hand); color: var(--pencil-ink); outline: none; }
  form.hand-add input::placeholder { color: rgba(46,34,22,.35); }
  form.hand-add button { border: none; background: none; font: 700 26px var(--hand); color: var(--pencil-ink); cursor: pointer; padding: 0 4px; }
  .sheet .empty-hand { padding: 10px 0 6px 56px; font: 700 26px/1.3 var(--hand); color: rgba(46,34,22,.55); }
  .pencil-deco { position: absolute; right: 14px; bottom: -10px; width: 190px; height: 16px; transform: rotate(-6deg); filter: drop-shadow(0 3px 2px rgba(0,0,0,.4)); pointer-events: none; z-index: 4; }

  /* ---- Notizen: Kreidetafel ---- */
  .screen--chalk { position: relative; border-radius: 18px; min-height: 220px; padding: 22px 20px 46px; background: radial-gradient(ellipse at 30% 0%, rgba(255,255,255,0.06), transparent 60%), var(--chalkboard); border: 10px solid var(--wood); box-shadow: 0 6px 0 var(--lift), inset 0 0 30px rgba(0,0,0,.35); }
  .notes { display: flex; flex-direction: column; gap: 10px; }
  .notes p { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; transform: rotate(var(--r, 0deg)); font: 600 23px/1.3 var(--hand); color: var(--chalk); margin: 0; }
  .notes p.write .note-text { animation: write .9s steps(16) both; }
  .note-text { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
  .note-del { background: none; border: none; color: rgba(237,233,218,0.45); cursor: pointer; font-size: 15px; flex-shrink: 0; padding: 4px; }
  .empty--dark { color: var(--chalk-dim); font: 600 22px var(--hand); text-align: center; padding: 26px 0; }

    background: radial-gradient(ellipse at 50% 120%, rgba(255,176,92,.22), transparent 60%), radial-gradient(ellipse at 30% -20%, rgba(150,200,255,.18), transparent 60%), #0F0D1A;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), inset 0 0 30px rgba(0,0,0,.6); }

  .num.up { animation: rollUp .3s cubic-bezier(.3,1.5,.5,1); } .num.down { animation: rollDown .3s cubic-bezier(.3,1.5,.5,1); }
  @keyframes rollUp { from { transform: translateY(60%); opacity: 0; } } @keyframes rollDown { from { transform: translateY(-60%); opacity: 0; } }
  .next-season { width: 100%; margin-top: 10px; border: 1.5px dashed rgba(255,176,92,.55); background: none; color: #FFB05C; font: 700 15px var(--ui); border-radius: 14px; padding: 9px; cursor: pointer; }

  .setup { max-width: 480px; margin: 24px auto; padding: 0 16px 60px; display: flex; flex-direction: column; gap: 14px; }
  .setup h2 { font-size: 23px; font-weight: 800; margin: 0 0 4px; color: var(--ink); }
  .setup p { color: var(--ink-soft); font-size: 15px; line-height: 1.5; margin: 0 0 8px; }
  .setup .box { background: var(--white); border-radius: 24px; padding: 18px; box-shadow: 0 5px 0 var(--lift); }
  .setup .plain { border: none; background: #EEF2F0; border-radius: 14px; padding: 10px 16px; cursor: pointer; font: 700 15px var(--ui); color: var(--ink); box-shadow: 0 3px 0 var(--lift); }
  .setup input[type="text"] { width: 100%; border: 3px solid #EEF2F0; border-radius: 14px; padding: 10px 14px; font: 600 16px var(--ui); margin-top: 6px; }
  .setup small { color: var(--muted); }
  .login-hero { text-align: center; padding-top: 30px; }
  .login-hero .staubi { width: 120px; height: 120px; margin: 0 auto 8px; display: block; }
  .seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 16px; background: #EEF2F0; }
  .seg button { border: none; background: none; font: 700 15px var(--ui); color: var(--ink-soft); padding: 8px 16px; border-radius: 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--white); color: var(--ink); box-shadow: 0 2px 0 var(--lift); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  }
</style>

<body>
<div id="root"><div class="wrap"><p class="loading">Lädt…</p></div></div>
<div id="toastWrap"></div>
<div id="confirmOverlay"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { initializeFirestore, getFirestore, persistentLocalCache, doc, collection, setDoc, updateDoc, getDoc, getDocs, deleteDoc, deleteField, runTransaction, onSnapshot, terminate, clearIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const CATEGORIES = {
    weekly: { label: "Wöchentlich", accent: "var(--weekly)", note: "Kehrt am Montag zurück" },

    once: { label: "Einmalig", accent: "var(--once)", note: "Einmal erledigen, dann weg" },
  };
  const PEOPLE = { Dome: "#2F6D5C", Sarah: "#B0475B" };
  const LS_ME_KEY = "huushaut-me";
  const LS_DATA_KEY = "huushaut-data-v2-cache";
  const LS_LEGACY_KEY = "haushaltsplan-data-cache";

  // Alle Daten liegen in household/data-v2, jeder Eintrag als eigenes Feld
  // (tasks.<id>, shopping.<id>, notes.<id>). Geschrieben wird immer nur das
  // Feld, das sich ändert — so kann ein Gerät mit veraltetem Stand nie mehr

  const DATA_DOC = "data-v2";
  const LEGACY_DOC = "tasks";
  const BACKUP_PREFIX = "backup-";
  const BACKUP_KEEP_DAYS = 30;

  // Staubi, das Maskottchen. Die Lider blinzeln ab und zu.
  const staubiSvg = (cls = "") => `<svg class="staubi ${cls}" id="staubi" viewBox="0 0 80 80" role="img" aria-label="Staubi">
    <ellipse cx="40" cy="77" rx="22" ry="3" fill="rgba(20,43,42,.15)"/>

    <path d="M18 24 l-6 -6 M26 15 l-3 -8 M40 10 l0 -8 M54 15 l3 -8 M62 24 l6 -6 M12 40 l-8 -2 M68 40 l8 -2" stroke="#A9B4C2" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="30" cy="42" rx="6" ry="7.5" fill="#fff"/><ellipse cx="50" cy="42" rx="6" ry="7.5" fill="#fff"/>
    <circle cx="31" cy="44" r="3.4" fill="#142B2A"/><circle cx="51" cy="44" r="3.4" fill="#142B2A"/>
    <rect class="lid" x="23" y="34" width="14" height="16" rx="6" fill="#A9B4C2"/><rect class="lid" x="43" y="34" width="14" height="16" rx="6" fill="#A9B4C2"/>
    <path d="M33 56 Q40 62 47 56" stroke="#142B2A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="22" cy="54" r="4" fill="#FF8FA3" opacity=".6"/><circle cx="58" cy="54" r="4" fill="#FF8FA3" opacity=".6"/>
  </svg>`;
  const PENCIL_SVG = `<svg class="pencil-deco" viewBox="0 0 210 16" aria-hidden="true"><rect x="0" y="3" width="18" height="10" rx="2" fill="#E7798C"/><rect x="17" y="3" width="10" height="10" fill="#C9C2A6"/><rect x="26" y="3" width="150" height="10" fill="#E9B949"/><path d="M26 6 h150" stroke="rgba(255,255,255,.35)" stroke-width="2"/><polygon points="176,3 205,8 176,13" fill="#D9B98A"/><polygon points="196,6.2 205,8 196,9.8" fill="#333"/></svg>`;
  // Strichzeichnungen statt Emojis: alle mit derselben Linie (2px, runde Enden)
  const ICONS = {
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    back: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
    pencil: '<path d="M4 20l1.2-4.2L15.6 5.4a2 2 0 012.8 0l.2.2a2 2 0 010 2.8L8.2 18.8z"/><path d="M13.5 7.5l3 3"/>',
    settings: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
    warn: '<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2v.1"/>',
    next: '<path d="M9 6l6 6-6 6"/>',
    broom: '<path d="M15 2.5l-3.5 8.5"/><path d="M8 11h7l3.5 9.5h-14z"/><path d="M9 15l-1 5.5M12 15v5.5M15 15l1 5.5"/>',
    sofa: '<path d="M5 11V8.5A2.5 2.5 0 017.5 6h9A2.5 2.5 0 0119 8.5V11"/><path d="M3.5 11A1.5 1.5 0 015 12.5V14h14v-1.5a1.5 1.5 0 013 0V18H2v-5.5A1.5 1.5 0 013.5 11z"/><path d="M5 18v2M19 18v2"/>',
    note: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    tv: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8M8.5 2.5L12 6l3.5-3.5"/>',
  };
  const icon = (name, size = 20) => `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
  const CHECK_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 L10 17 L19 7" stroke="#FFD84D" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const LINES = ["Blitzblank!", "Du Held:in!", "Weg damit!", "Läuft bei euch!", "Staubi ist stolz!", "Ein Ding weniger!", "Das Sofa rückt näher.", "Stark gemacht!", "So sauber, ich blende!"];
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? 0 : ms));

  // Fest eingebaute Firebase-Zugangsdaten für Huushaut
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyD8xfS4b3cyQtoP8AdD6ezqWNbGAY0uCvM",
    authDomain: "huushaut.firebaseapp.com",
    projectId: "huushaut",
    storageBucket: "huushaut.firebasestorage.app",
    messagingSenderId: "235343277866",
    appId: "1:235343277866:web:7ebb67c817a04112aa7853"
  };

  let tasks = [];
  let shopping = [];
  let notes = [];
  let series = [];
  let activeChapter = "home"; // home | plan | shopping | notes
  let activeTab = "weekly";   // weekly | monthly | once | erledigt (innerhalb "plan")
  let db = null;
  let dataRef = null;
  let legacyRef = null;
  let connStatus = "wait"; // wait | ok | err
  let saveError = null;
  let remoteData = null;     // zuletzt empfangener Stand von data-v2
  let legacyData = null;     // zuletzt vom Server empfangener Stand des alten Dokuments
  let dataReady = false;     // erst schreiben, wenn data-v2 sicher existiert
  let migrating = false;
  let lastRenderedJson = null;
  let pendingRender = false; // Neuzeichnen aufgeschoben, solange gezogen wird
  let backupDoneFor = null;
  let auth = null;
  let currentUser = null;
  let authChecked = false;   // erst nach der ersten Rückmeldung von Firebase Auth wissen wir, ob jemand angemeldet ist
  let accessDenied = false;  // angemeldet, aber das Konto steht nicht in den Firestore-Regeln
  let listenersStarted = false;
  let me = null;               // "Dome" oder "Sarah": wer auf diesem Gerät angemeldet ist
  try { me = localStorage.getItem(LS_ME_KEY); } catch (e) {}
  let staubiLine = null;       // letzter Spruch von Staubi, bleibt beim Neuzeichnen stehen
  let lastChapter = null;      // für Einblend-Animationen nur beim Wechsel des Bereichs
  let justAddedShopId = null, justToggledShopId = null, justAddedNoteId = null;
  let askedWho = false;

  const pad = (n) => String(n).padStart(2, "0");
  function getISOWeekKey(d) {
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
    const weekNum = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
    return `${date.getUTCFullYear()}-W${pad(weekNum)}`;
  }
  const getMonthKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  function currentPeriodKey(category, now) {
    if (category === "weekly") return getISOWeekKey(now);
    if (category === "monthly") return getMonthKey(now);
    return null;
  }
  function formatDate(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }
  function focusInput(id) {
    // Der Screen wird bei jeder Änderung neu aufgebaut, daher den Fokus erst nach
    // dem nächsten Frame setzen, wenn das neue Element wirklich im DOM ist.
    requestAnimationFrame(() => {
      const el = document.getElementById(id);
      if (el) el.focus();
    });
  }
  // Kurze Meldung unten; actions = [{ label, onClick }] für Knöpfe wie "Rückgängig".
  let toastTimer = 0;
  function showToast(msg, actions = [], ms = 2600) {
    const wrap = document.getElementById("toastWrap");
    wrap.innerHTML = "";
    const t = document.createElement("div");
    t.className = "toast"; t.setAttribute("role", "status");
    const span = document.createElement("span"); span.textContent = msg; t.appendChild(span);
    actions.forEach((a) => {
      const b = document.createElement("button"); b.textContent = a.label;
      b.onclick = () => { wrap.innerHTML = ""; a.onClick(); };
      t.appendChild(b);
    });
    const x = document.createElement("button"); x.className = "x"; x.innerHTML = icon("x", 16); x.setAttribute("aria-label", "Schliessen");
    x.onclick = () => (wrap.innerHTML = ""); t.appendChild(x);
    wrap.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { if (wrap.contains(t)) wrap.innerHTML = ""; }, actions.length ? Math.max(ms, 5000) : ms);
  }
  function showDialog(message, buttons) {
    const wrap = document.getElementById("confirmOverlay");
    wrap.innerHTML = `<div class="dialog-bg"><div class="dialog" role="dialog" aria-modal="true"><p>${escapeHtml(message)}</p><div class="row"></div></div></div>`;
    const row = wrap.querySelector(".row");
    buttons.forEach((b) => {
      const el = document.createElement("button");
      el.className = "btn" + (b.primary ? " primary" : "") + (b.big ? " big" : "");
      el.textContent = b.label;
      el.onclick = () => { wrap.innerHTML = ""; if (b.onClick) b.onClick(); };
      row.appendChild(el);
    });
    row.querySelector(".primary, .btn")?.focus();
  }
  function askConfirm(message, onYes, yesLabel = "Ja, löschen") {
    showDialog(message, [{ label: "Nein" }, { label: yesLabel, primary: true, onClick: onYes }]);
  }
  // Fragt einmal, wer dieses Handy benutzt; danach reicht beim Erledigen ein Tipp.
  function askWho(then) {
    showDialog("Hallo! Wer bist du? Dann bucht Staubi erledigte Aufgaben automatisch auf dich.",
      Object.keys(PEOPLE).map((p) => ({ label: p, primary: true, onClick: () => { setMe(p); if (then) then(); } })));
  }
  function setMe(p) {
    me = p;
    try { localStorage.setItem(LS_ME_KEY, p); } catch (e) {}
    lastRenderedJson = null;
    if (!document.getElementById("settingsScreen")) renderApp();
  }
  function greeting() {
    const h = new Date().getHours();
    const hi = h < 11 ? "Guten Morgen" : h < 17 ? "Hallo" : h < 22 ? "Schönen Abend" : "Gute Nacht";
    return `${hi}${me ? ", " + me : ""}! ${h >= 22 ? "Morgen ist auch noch ein Tag." : "Packen wir's an?"}`;
  }
  function cheer(text) {
    staubiLine = text;
    const bub = document.getElementById("bubble");
    if (bub) { bub.textContent = text; bub.classList.remove("pop"); void bub.offsetWidth; bub.classList.add("pop"); }
    const st = document.getElementById("staubi");
    if (st) { st.classList.remove("jump"); void st.getBoundingClientRect(); st.classList.add("jump"); }
  }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) {} }

  // ---------- Konfetti ----------
  let confettiParts = [], confettiRaf = 0;
  function confetti(x, y, n = 34, spread = 6) {
    if (reduceMotion) return;
    let c = document.getElementById("confetti");
    if (!c) { c = document.createElement("canvas"); c.id = "confetti"; document.body.appendChild(c); }

  // ---------- Datenmodell ----------
  const byShopOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || (b.createdAt || 0) - (a.createdAt || 0);
  function arrayToMap(arr) {

  // Wandelt den Inhalt eines Dokuments (neues oder altes Format) in die drei Listen um.

  function readLists(data) {

    const t = legacy ? arrayToMap(d.list) : d.tasks || {};
    const s = legacy ? arrayToMap((d.shopping || []).map((x, i) => ({ ...x, order: i }))) : d.shopping || {};

    return {
      tasks: Object.values(t).filter((x) => x && x.id && x.title),
      shopping: Object.values(s).filter((x) => x && x.id && x.text).sort(byShopOrder),

  function renderIfChanged() {

  // Schreibt nur die übergebenen Felder (z. B. {"shopping.abc.bought": true}).
  // Die Anzeige aktualisiert sich über onSnapshot sofort, auch offline.
  function write(changes) {

    if (Object.keys(changes).length === 0) return true;
    updateDoc(dataRef, changes).then(() => {
      if (saveError) { saveError = null; renderIfChanged(); }
    }).catch((e) => {

  // Wöchentliche/monatliche Aufgaben zurücksetzen. Läuft nur mit einem frisch vom

  function applyResets() {
    const now = new Date();

    tasks.forEach((t) => {
      if (t.status === "done" && (t.category === "weekly" || t.category === "monthly") && t.periodKey !== currentPeriodKey(t.category, now)) {
        changes[`tasks.${t.id}.status`] = "active";
        changes[`tasks.${t.id}.doneBy`] = null;
        changes[`tasks.${t.id}.doneAt`] = null;
        changes[`tasks.${t.id}.periodKey`] = null;

  }

  // ---------- Sicherungen ----------
  const backupRef = (id) => doc(db, "household", BACKUP_PREFIX + id);

  function backupPayload(reason, data) {
    return { savedAt: Date.now(), reason, ...listsToMaps(readLists(data)) };
  }
  async function createBackup(reason) {
    const d = new Date();
    const id = `${dayKey(d)}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}-${reason}`;
    await setDoc(backupRef(id), backupPayload(reason, remoteData));
  }
  // Einmal pro Tag den Stand sichern und Sicherungen älter als BACKUP_KEEP_DAYS entfernen.
  async function dailyBackup() {
    const today = dayKey(new Date());
    if (backupDoneFor === today) return;
    backupDoneFor = today;
    try {
      const ref = backupRef(today);
      const existing = await getDoc(ref);
      if (!existing.exists()) await setDoc(ref, backupPayload("täglich", remoteData));
      const cutoff = Date.now() - BACKUP_KEEP_DAYS * 86400000;
      const all = await listBackups();
      await Promise.all(all.filter((b) => b.savedAt < cutoff).map((b) => deleteDoc(backupRef(b.id))));
    } catch (e) {
      console.error("Sicherung fehlgeschlagen", e);

    }
  }
  async function listBackups() {
    const snap = await getDocs(collection(db, "household"));
    const out = [];
    snap.forEach((d) => {
      if (!d.id.startsWith(BACKUP_PREFIX)) return;
      const data = d.data();
      out.push({ id: d.id.slice(BACKUP_PREFIX.length), savedAt: data.savedAt || 0, reason: data.reason || "", data });
    });
    return out.sort((a, b) => b.savedAt - a.savedAt);
  }
  async function restoreBackup(backup) {

  }

  // ---------- Umstellung vom alten Dokument ----------
  // Legt data-v2 einmalig aus household/tasks an. Die Transaktion sorgt dafür,
  // dass das auch bei zwei gleichzeitig startenden Geräten nur einmal passiert.
  async function migrateLegacy() {
    if (migrating) return;
    migrating = true;
    try {
      await runTransaction(db, async (tx) => {
        const current = await tx.get(dataRef);
        if (current.exists()) return;
        const old = await tx.get(legacyRef);
        const oldData = old.exists() ? old.data() : {};
        tx.set(backupRef(`${dayKey(new Date())}-umstellung`), backupPayload("umstellung", oldData));
        tx.set(dataRef, { schema: 2, migratedAt: Date.now(), legacyImported: {}, ...listsToMaps(readLists(oldData)) });
      });
    } catch (e) {
      console.error(e);
      saveError = e && e.code === "permission-denied"
        ? "Datenbank-Umstellung blockiert: Firestore-Regeln erlauben kein Schreiben in 'household/data-v2'."

    const imported = remoteData.legacyImported || {};
    const old = readLists(legacyData);

    const minOrder = shopping.length ? shopping[0].order ?? 0 : 0;
    const changes = {};
    const take = (kind, list) => list.forEach((x) => {
      if ((x.createdAt || 0) <= since || known.has(x.id) || imported[x.id]) return;
      changes[`${kind}.${x.id}`] = kind === "shopping" ? { ...x, order: minOrder - 1 - (x.order ?? 0) } : x;
      changes[`legacyImported.${x.id}`] = true;
    });
    take("tasks", old.tasks);
    take("shopping", old.shopping);
    take("notes", old.notes);
    write(changes);
  }

  // ---------- Einkaufsliste: Ziehen zum Sortieren ----------
  let dragState = null;
  function shoppingDragStart(id, e) {
    if (e.button !== undefined && e.button !== 0) return;

    const rowEl = rows[startIndex];
    const rect = rowEl.getBoundingClientRect();
    const gap = parseFloat(getComputedStyle(list).rowGap || "0") || 0;
    dragState = { id, startIndex, hoverIndex: startIndex, startY: e.clientY, rowHeight: rect.height + gap, rowEl, rows };

    rowEl.style.transition = "none";
    try { rowEl.setPointerCapture(e.pointerId); } catch (err) {}

    rowEl.addEventListener("pointerup", shoppingDragEnd);
    rowEl.addEventListener("pointercancel", shoppingDragEnd);

    dragState.rowEl.style.transform = `translateY(${deltaY}px)`;
    const rawIndex = dragState.startIndex + Math.round(deltaY / dragState.rowHeight);
    const newHoverIndex = Math.max(0, Math.min(dragState.rows.length - 1, rawIndex));
    if (newHoverIndex !== dragState.hoverIndex) {
      const lo = Math.min(dragState.hoverIndex, newHoverIndex, dragState.startIndex);
      const hi = Math.max(dragState.hoverIndex, newHoverIndex, dragState.startIndex);
      for (let i = lo; i <= hi; i++) {
        if (i === dragState.startIndex) continue;
        const el = dragState.rows[i];
        if (!el) continue;
        const shiftUp = i > dragState.startIndex && i <= newHoverIndex;
        const shiftDown = i < dragState.startIndex && i >= newHoverIndex;
        el.style.transition = "transform .15s";
        el.style.transform = shiftUp ? `translateY(-${dragState.rowHeight}px)` : shiftDown ? `translateY(${dragState.rowHeight}px)` : "";

      const rest = shopping.filter((s) => s.id !== id);

    const byId = new Map(series.map((x) => [x.id, x]));

  function setSeriesPos(id, season, episode, dir, field) {

    episode = Math.max(1, Math.min(999, episode));

  function renameSeries(id, raw) {

    const item = series.find((x) => x.id === id);
    if (title && item && title !== item.title) write({ [`series.${id}.title`]: title });
    else renderSeriesContent();
  }
  function deleteSeries(id) {
    const item = series.find((x) => x.id === id);
    askConfirm(`„${item ? item.title : "Serie"}" von der Liste nehmen?`, () => write({ [`series.${id}`]: deleteField() }), "Ja, entfernen");
  }
  function sinceText(ts) {
    if (!ts) return "";
    const days = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(ts).setHours(0, 0, 0, 0)) / 86400000);
    return days <= 0 ? "heute" : days === 1 ? "gestern" : days < 7 ? `vor ${days} Tagen` : `am ${formatDate(ts)}`;
  }

  // ---------- Rendering: Rahmen ----------
  function renderApp() {
    const root = document.getElementById("root");
    if (authChecked && !currentUser) { renderLoginScreen(); return; }
    if (accessDenied) { renderDeniedScreen(); return; }
    const entering = activeChapter !== lastChapter;
    lastChapter = activeChapter;
    // Halb Getipptes und den Cursor über das Neuzeichnen retten, z. B. wenn
    // gerade eine Änderung vom anderen Handy ankommt.
    const typed = {};
    if (!entering) root.querySelectorAll("input[id]").forEach((i) => { if (i.value) typed[i.id] = i.value; });
    const active = document.activeElement;
    const focusId = !entering && active && active.tagName === "INPUT" && active.id ? active.id : null;
    const sel = focusId ? [active.selectionStart, active.selectionEnd] : null;
    const dotClass = connStatus === "ok" ? "ok" : connStatus === "err" ? "err" : "wait";
    const dotText = connStatus === "ok" ? "verbunden" : connStatus === "err" ? "keine Verbindung" : "verbinde…";
    const chapterTitle = activeChapter === "plan" ? "Haushaltsplan" : activeChapter === "shopping" ? "Einkaufsliste" : activeChapter === "notes" ? "Notizen" : activeChapter === "tv" ? "Serien" : "Huushaut";

    root.innerHTML = `
      <div class="wrap">
        <header class="app-head">
          <div class="title-row">
            ${activeChapter !== "home" ? `<button class="back-btn" id="backHomeBtn" aria-label="Zurück">${icon("back", 22)}</button>` : ""}

            </div>
          </div>
          <button class="icon-btn" id="settingsLink" aria-label="Einstellungen">${icon("settings", 22)}</button>
        </header>
        ${saveError ? `<div class="confirm-bar">${icon("warn", 18)}<span>${saveError}</span></div>` : ""}
        <div id="chapterBody"></div>
      </div>`;

    document.getElementById("settingsLink").onclick = renderSetupScreen;
    const backBtn = document.getElementById("backHomeBtn");
    if (backBtn) backBtn.onclick = () => { activeChapter = "home"; staubiLine = null; renderApp(); };

    if (activeChapter === "plan") renderPlanChapter();
    else if (activeChapter === "shopping") renderShoppingChapter(entering);
    else if (activeChapter === "notes") renderNotesChapter();
    else if (activeChapter === "tv") renderSeriesChapter(entering);
    else renderHome(entering);

    Object.entries(typed).forEach(([id, v]) => { const i = document.getElementById(id); if (i && !i.value) i.value = v; });
    if (focusId) {
      const i = document.getElementById(focusId);
      if (i) { i.focus(); try { i.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
    }

    const st = document.getElementById("staubi");
    if (st) st.onclick = () => cheer(LINES[Math.floor(Math.random() * LINES.length)]);
    if (currentUser && !me && !askedWho) { askedWho = true; askWho(); }
  }

    const nav = document.getElementById("planTabs");

      const isErledigt = tab === "erledigt";
      const btn = document.createElement("button");
      btn.className = "pill" + (activeTab === tab ? " active" : "");

  function renderPlanForm() {
    const slot = document.getElementById("formSlot");

    const meta = CATEGORIES[activeTab];
    slot.innerHTML = `<form class="add" id="addForm">

  }
  function renderPlanContent() {
    const el = document.getElementById("content");
    const isErledigt = activeTab === "erledigt";
    const visible = isErledigt
      ? tasks.filter((t) => t.status === "done").sort((a, b) => b.doneAt - a.doneAt)
      : tasks.filter((t) => t.category === activeTab && t.status === "active").sort((a, b) => b.createdAt - a.createdAt);

    if (visible.length === 0) {
      const anyInCat = tasks.some((t) => t.category === activeTab);
      el.innerHTML = isErledigt
        ? `<div class="empty"><span class="art">${icon("broom", 56)}</span>Noch nichts erledigt. Staubi wartet schon.</div>`
        : anyInCat
          ? `<div class="empty"><span class="art">${icon("sofa", 56)}</span>Alles erledigt hier. Gönnt euch was!</div>`
          : `<div class="empty"><span class="art">${icon("note", 56)}</span>Noch keine ${CATEGORIES[activeTab].label.toLowerCase()}e Aufgabe. Leg oben die erste an.</div>`;
      return;
    }
    const wrap = document.createElement("div");
    wrap.className = "cards";
    visible.forEach((t) => {
      const card = document.createElement("div");
      card.dataset.card = t.id;
      if (isErledigt) {
        card.className = "card is-done";
        const color = PEOPLE[t.doneBy] || "#7A8F8C";
        card.innerHTML = `<span class="check" aria-hidden="true">${CHECK_SVG}</span>
          <div class="t"><b>${escapeHtml(t.title)}</b><small><span class="who-dot" style="background:${color}">${escapeHtml((t.doneBy || "?")[0])}</span>${escapeHtml(t.doneBy || "")} · ${formatDate(t.doneAt)}</small></div>

        card.className = `card cat-${t.category}`;
        card.innerHTML = `<button class="check" data-done="${t.id}" aria-label="${escapeHtml(t.title)} erledigt">${CHECK_SVG}</button>
          <div class="t"><b>${escapeHtml(t.title)}</b><small>${CATEGORIES[t.category].note}</small></div>
          <button class="del" data-del="${t.id}" aria-label="Löschen">${icon("x", 18)}</button>`;
      }
      wrap.appendChild(card);
    });
    el.innerHTML = "";
    el.appendChild(wrap);
    wrap.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => deleteTask(b.dataset.del));
    wrap.querySelectorAll("[data-done]").forEach((b) => b.onclick = () => markDone(b.dataset.done));
    wrap.querySelectorAll("[data-reopen]").forEach((b) => b.onclick = () => reopenTask(b.dataset.reopen));
  }

  function renderShoppingContent() {
    const el = document.getElementById("content");
    if (!el) return;
    const boughtCount = shopping.filter((s) => s.bought).length;
    const slot = document.getElementById("eraserSlot");
    if (slot) {
      slot.innerHTML = boughtCount ? `<button class="eraser-btn" id="clearBoughtBtn" type="button">Wegradieren (${boughtCount})</button>` : "";
      const clearBtn = document.getElementById("clearBoughtBtn");
      if (clearBtn) clearBtn.onclick = clearBoughtItems;
    }
    if (shopping.length === 0) {
      el.innerHTML = `<div class="empty-hand">Alles da! Nichts zu kaufen.</div>`;
      return;
    }
    const list = document.createElement("ul");
    list.className = "list-paper";
    list.id = "shopList";
    shopping.forEach((s) => {
      const li = document.createElement("li");
      li.dataset.shopid = s.id;
      if (s.bought) li.classList.add("bought");
      if (s.id === justToggledShopId && s.bought) li.classList.add("animate");
      if (s.id === justAddedShopId) li.classList.add("write");
      if (editingShopId === s.id) {
        const handle = document.createElement("span");
        handle.className = "drag-handle";
        const input = document.createElement("input");
        input.type = "text";
        input.className = "edit-input";
        input.autocomplete = "off";
        input.setAttribute("aria-label", "Eintrag bearbeiten");
        input.value = editingShopDraft ?? s.text;
        input.addEventListener("input", () => { editingShopDraft = input.value; });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); saveShoppingEdit(s.id, input.value); }
          if (e.key === "Escape") { e.preventDefault(); cancelShoppingEdit(); }
        });
        const saveBtn = document.createElement("button");
        saveBtn.type = "button";
        saveBtn.className = "paper-btn";
        saveBtn.textContent = "Speichern";
        saveBtn.onclick = () => saveShoppingEdit(s.id, input.value);
        const cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.className = "del-btn";
        cancelBtn.setAttribute("aria-label", "Abbrechen");
        cancelBtn.innerHTML = icon("x", 18);
        cancelBtn.onclick = () => cancelShoppingEdit();
        li.append(handle, input, saveBtn, cancelBtn);
        const firstOpen = editingShopDraft === null;
        requestAnimationFrame(() => { input.focus(); if (firstOpen) input.select(); });
      } else {
        li.innerHTML = `
          <button class="drag-handle" data-drag="${s.id}" aria-label="Verschieben">⠿</button>
          <button class="item-btn" data-bought="${s.id}" aria-label="${s.bought ? "Wieder auf die Liste" : "Als gekauft durchstreichen"}: ${escapeHtml(s.text)}"><span class="item">${escapeHtml(s.text)}${s.bought ? strikeSvg(s.id) : ""}</span></button>
          <button class="edit-btn" data-edit="${s.id}" aria-label="Bearbeiten">${icon("pencil", 18)}</button>`;
      }
      list.appendChild(li);
    });
    justToggledShopId = null;
    justAddedShopId = null;
    el.innerHTML = "";
    el.appendChild(list);

    el.querySelectorAll("[data-bought]").forEach((b) => b.addEventListener("click", () => toggleBought(b.dataset.bought)));
    el.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => startEditShopping(b.dataset.edit));
    el.querySelectorAll("[data-drag]").forEach((h) => h.addEventListener("pointerdown", (e) => shoppingDragStart(h.dataset.drag, e)));
  }

        </div>`;

    const btn = document.getElementById("doResetBtn");
    input.addEventListener("input", () => {
      const ready = input.value.trim() === "LÖSCHEN";
      btn.disabled = !ready;
      btn.style.opacity = ready ? "1" : ".45";
    });
    btn.onclick = async () => {
      if (input.value.trim() !== "LÖSCHEN") return;
      if (!dataReady) { showToast("Noch nicht mit der Datenbank verbunden"); return; }
      try {
        await createBackup("vor-loeschen");
      } catch (e) {
        console.error(e);
        showToast("Sicherung fehlgeschlagen — es wurde nichts gelöscht");
        return;
      }
      write({ tasks: {}, shopping: {}, notes: {}, series: {} });
      showToast("Alles gelöscht (Sicherung angelegt)");
      lastRenderedJson = null;
      renderApp();
    };
  }
  async function renderBackupList() {
    const box = document.getElementById("backupList");
    if (!box) return;
    if (!db) { box.innerHTML = "<p>Keine Verbindung zur Datenbank.</p>"; return; }
    let backups;
    try {
      backups = await listBackups();
    } catch (e) {
      console.error(e);
      if (document.getElementById("backupList")) box.innerHTML = "<p>Sicherungen konnten nicht geladen werden.</p>";
      return;
    }
    if (!document.getElementById("backupList")) return;
    if (backups.length === 0) { box.innerHTML = "<p>Noch keine Sicherung vorhanden.</p>"; return; }
    box.innerHTML = "";
    backups.forEach((b) => {
      const lists = readLists(b.data);
      const d = new Date(b.savedAt);
      const when = `${formatDate(b.savedAt)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;";
      row.innerHTML = `<span>${when} · ${escapeHtml(b.reason)}<br><small>${lists.tasks.length} Aufgaben · ${lists.shopping.length} Einkauf · ${lists.notes.length} Notizen · ${lists.series.length} Serien</small></span>`;
      const btn = document.createElement("button");
      btn.className = "plain";
      btn.style.marginTop = "0";
      btn.textContent = "Zurückholen";
      btn.onclick = () => askConfirm(`Stand vom ${when} zurückholen? Der aktuelle Stand wird vorher gesichert.`, async () => {
        if (!dataReady) { showToast("Noch nicht mit der Datenbank verbunden"); return; }
        try {
          await restoreBackup(b);
          showToast("Stand zurückgeholt");
          lastRenderedJson = null;
          renderApp();
        } catch (e) {
          console.error(e);
          showToast("Zurückholen fehlgeschlagen");
        }
      }, "Ja, zurückholen");
      row.appendChild(btn);
      box.appendChild(row);
    });
  }

  // ---------- Firebase-Verbindung ----------
  function saveLocalCache() {
    try { localStorage.setItem(LS_DATA_KEY, JSON.stringify(listsToMaps({ tasks, shopping, notes, series }))); } catch (e) {}
  }
  // ---------- Anmeldung ----------
  function renderLoginScreen(message) {
    const root = document.getElementById("root");
    root.innerHTML = `
      <div class="setup login-hero" id="loginScreen">
        ${staubiSvg()}
        <h2>Willkommen bei Huushaut!</h2>
        <p>Melde dich mit deinem Google-Konto an. Dann siehst du den Haushaltsplan, die Einkaufsliste und die Notizen.</p>
        ${message ? `<p style="color:var(--coral-dark);font-weight:600;">${escapeHtml(message)}</p>` : ""}
        <button class="btn primary big" id="loginBtn">Mit Google anmelden</button>
      </div>`;
    document.getElementById("loginBtn").onclick = login;
  }
  function renderDeniedScreen() {
    const root = document.getElementById("root");
    root.innerHTML = `
      <div class="setup login-hero" id="loginScreen">
        ${staubiSvg()}
        <h2>Kein Zugriff</h2>
        <p>Das Konto <b>${escapeHtml(currentUser ? currentUser.email || "" : "")}</b> ist nicht für Huushaut freigeschaltet. Melde dich mit dem richtigen Google-Konto an, oder lass die Adresse in den Firestore-Regeln eintragen.</p>
        <button class="btn primary big" id="logoutBtn">Mit anderem Konto anmelden</button>
      </div>`;
    document.getElementById("logoutBtn").onclick = logout;
  }
  function authErrorText(e) {
    const code = e && e.code;
    if (code === "auth/unauthorized-domain") return "Diese Adresse ist in Firebase noch nicht für die Anmeldung freigegeben (Authentication → Einstellungen → Autorisierte Domains).";
    if (code === "auth/operation-not-allowed") return "Google-Anmeldung ist in Firebase noch nicht eingeschaltet (Authentication → Anmeldemethode).";
    if (code === "auth/network-request-failed") return "Keine Internetverbindung. Für die erste Anmeldung braucht es Netz.";
    return "Anmeldung fehlgeschlagen. Bitte nochmal versuchen.";
  }
  async function login() {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      // In manchen Homescreen-Apps (v. a. iOS) gehen keine Popups — dann per Weiterleitung
      if (e && ["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/web-storage-unsupported"].includes(e.code)) {
        try { await signInWithRedirect(auth, provider); return; } catch (e2) { e = e2; }
      }
      if (e && (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request")) return;
      console.error(e);
      renderLoginScreen(authErrorText(e));
    }
  }
  async function logout() {
    try { localStorage.removeItem(LS_DATA_KEY); localStorage.removeItem(LS_LEGACY_KEY); } catch (e) {}
    // Offline-Kopie der Datenbank von diesem Gerät entfernen
    try { await terminate(db); await clearIndexedDbPersistence(db); } catch (e) { console.error(e); }
    try { await signOut(auth); } catch (e) { console.error(e); }
    location.reload();
  }

  // ---------- Firebase-Verbindung ----------
  function connectFirebase(cfg) {
    try {
      const app = initializeApp(cfg);
      try {
        db = initializeFirestore(app, { localCache: persistentLocalCache() });
      } catch (e) {
        console.warn("Offline-Speicher nicht verfügbar, nutze Standard-Verbindung", e);
        db = getFirestore(app);
      }
      dataRef = doc(db, "household", DATA_DOC);
      legacyRef = doc(db, "household", LEGACY_DOC);
      auth = getAuth(app);
      getRedirectResult(auth).catch((e) => { console.error(e); renderLoginScreen(authErrorText(e)); });
      onAuthStateChanged(auth, (user) => {
        const wasSignedIn = !!currentUser;
        currentUser = user;
        authChecked = true;
        if (user) startListeners();
        else if (wasSignedIn || listenersStarted) { location.reload(); return; }
        else {
          // Nicht angemeldet: zwischengespeicherte Daten nicht weiter anzeigen
          try { localStorage.removeItem(LS_DATA_KEY); localStorage.removeItem(LS_LEGACY_KEY); } catch (e) {}
          applyLists({ tasks: [], shopping: [], notes: [], series: [] });
        }
        lastRenderedJson = null;
        renderApp();
      });
    } catch (e) {
      console.error(e);
      connStatus = "err";
      renderApp();
      showToast("Zugangsdaten scheinen ungültig");
    }
  }
  function onListenError(err) {
    console.error(err);
    if (err && err.code === "permission-denied" && currentUser) {
      accessDenied = true;
      renderApp();
      return;
    }
    connStatus = "err";
    renderIfChanged();
    showToast("Verbindung fehlgeschlagen — Zugangsdaten oder Firestore-Regeln prüfen");
  }
  function startListeners() {
    if (listenersStarted) return;
    listenersStarted = true;
    onSnapshot(dataRef, { includeMetadataChanges: true }, (snap) => {
      const fromServer = !snap.metadata.fromCache;
      if (fromServer) connStatus = "ok";
      if (!snap.exists()) {
        // Nichts schreiben, solange nicht feststeht, dass das Dokument wirklich fehlt
        dataReady = false;
        if (fromServer) migrateLegacy();
        renderIfChanged();
        return;
      }
      dataReady = true;
      remoteData = snap.data();
      applyLists(readLists(remoteData));
      saveLocalCache();
      renderIfChanged();
      if (fromServer && !snap.metadata.hasPendingWrites) {
        applyResets();
        importLegacyAdditions();
        dailyBackup();
      }
    }, onListenError);

    onSnapshot(legacyRef, (snap) => {
      if (snap.metadata.fromCache) return;
      legacyData = snap.exists() ? snap.data() : null;
      importLegacyAdditions();
    }, (err) => console.error(err));
  }

  // ---------- Start ----------
  // Zuletzt gespeicherten Stand sofort anzeigen, damit die App nicht auf die
  // Live-Verbindung warten muss — im Hintergrund wird dann synchronisiert.
  // Dieser Stand wird nur angezeigt, nie zurück in die Datenbank geschrieben.
  try {
    const cached = localStorage.getItem(LS_DATA_KEY) || localStorage.getItem(LS_LEGACY_KEY);
    if (cached) applyLists(readLists(JSON.parse(cached)));
  } catch (e) {}
  renderApp();
  connectFirebase(FIREBASE_CONFIG);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("serviceworker.js").catch(() => {}));
  }
</script>
</body>
</html>
